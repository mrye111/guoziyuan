name: Update live status

# 每 10 分钟检查虎牙直播间开播状态；
# 开播/下播发生变化时提交 main，随后自动触发 Pages 部署

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch live status
        run: node scripts/fetch-live-status.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain src/data/live-status.json) ]]; then
            git add src/data/live-status.json
            git commit -m "chore: 直播状态更新（$(date '+%Y-%m-%d %H:%M') UTC）"
            git push
          fi
