name: Update live replays

# 每天定时抓取 B站录像合集，更新 src/data/streams.json；
# 有更新就提交回 main，随后自动触发 Pages 部署

on:
  schedule:
    - cron: '17 3 * * *' # 每天北京时间 11:17（UTC 03:17）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch latest replays
        run: node scripts/fetch-replays.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain src/data/streams.json) ]]; then
            git add src/data/streams.json
            git commit -m "chore: 同步最新直播回放（$(date +%Y-%m-%d)）"
            git push
          else
            echo "没有新的回放"
          fi
